# ==========================================================================
# APMS.ai — Netlify configuration
#
# There is no build step. The repository root IS the site, so Netlify only
# needs to know that and to stop looking for a bundler.
# ==========================================================================

[build]
  publish = "."
  command = ""

# --------------------------------------------------------------------------
# Security headers.
# signin.html carries its own stricter Content-Security-Policy in a meta tag,
# which stays as it is. These apply to every response.
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing on the site uses the camera, microphone or location. The chatbot
    # mic button is a demo and never calls getUserMedia, so denying these
    # costs nothing and removes the permission prompts as an attack surface.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-DNS-Prefetch-Control = "on"

# --------------------------------------------------------------------------
# Caching.
# HTML must always be revalidated, or visitors keep an old page that points
# at stylesheet versions which no longer match.
#
# CSS and JS are safe to cache hard because every reference carries a ?v=
# query string and Netlify includes the query string in its cache key. Bumping
# ?v= is therefore a different URL and fetches fresh. If you ever stop using
# ?v= for cache busting, shorten these.
# --------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# --------------------------------------------------------------------------
# Tidy URLs: /about should work as well as /about.html.
# --------------------------------------------------------------------------
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# --------------------------------------------------------------------------
# The two standalone generated files are not part of the site. They are
# unlinked, and machine-health-vitals.html loads React from unpkg.com, which
# no other page does. Send anyone who finds them to the homepage.
# --------------------------------------------------------------------------
[[redirects]]
  from = "/machine-health-vitals"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/machine-health-vitals.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pipeline-step-preview"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pipeline-step-preview.html"
  to = "/"
  status = 301
  force = true
